name: CI — build check

# Deploys are handled by the platforms' own git integrations:
#   frontend → Vercel   (auto-deploys on push to main)
#   backend  → Render    (render.yaml blueprint, auto-deploys on push to main)
# This workflow only proves both halves still build, so a broken commit is
# caught here rather than in a platform build.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  backend:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run build
