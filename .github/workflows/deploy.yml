name: Automated Deployment — Vercel & EC2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Build & Deploy Frontend -> Vercel
  # ─────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Build & Deploy Frontend → Vercel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://apiforensecure.forensecure.in
          NODE_ENV: production

      - name: 🚀 Deploy Frontend to Vercel
        working-directory: frontend
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes


  # ─────────────────────────────────────────────────────────────────
  # 2. Build & Deploy Backend -> EC2 & PM2
  # ─────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🖥️ Build & Deploy Backend → EC2
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: 🔨 Compile TypeScript → dist/
        working-directory: backend
        run: npm run build

      - name: 🧹 Prune devDependencies
        working-directory: backend
        run: npm prune --production

      - name: 📤 Upload built backend artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "backend/dist/,backend/node_modules/,backend/package.json,backend/ecosystem.config.js,backend/drizzle/"
          target: /home/ubuntu/forensecure
          strip_components: 0

      - name: 🔄 Start / Restart Backend process in PM2 on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR="/home/ubuntu/forensecure/backend"
            mkdir -p "$APP_DIR"

            # Write .env from GitHub Secret
            printf '%s' "$BACKEND_ENV" > "$APP_DIR/.env"

            cd "$APP_DIR"
            if pm2 list | grep -q "forensecure-api"; then
              pm2 restart forensecure-api --update-env
            else
              if [ -f ecosystem.config.js ]; then
                pm2 start ecosystem.config.js --env production
              else
                pm2 start dist/server.js --name forensecure-api
              fi
            fi
            pm2 save
            echo "✅ Backend successfully running on EC2 via PM2!"
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}

